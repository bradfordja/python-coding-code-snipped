[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remittance-processor"
version = "0.1.0"
description = "AWS Lambda sample for remitted payment processing with SNS, IAM, S3, RDS, Redis, and a third-party payment API."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34",
  "psycopg[binary]>=3.1",
  "redis>=5.0",
  "requests>=2.31"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
